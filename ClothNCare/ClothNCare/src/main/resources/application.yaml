spring:
  datasource:
    url: jdbc:sqlite:file:./data/clothncare.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: ClothNCare

# Secret must be at least 32 chars. Set the JWT_SECRET_KEY environment
# variable when running (never commit a real secret to the repository).
jwt:
  secret: ${JWT_SECRET_KEY:}
