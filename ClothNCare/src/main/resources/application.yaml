spring:
  main:
    lazy-initialization: true  # start fast on low-spec PCs; beans load on first use
  datasource:
    url: jdbc:sqlite:file:./data/clothncare.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 10000

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false  # don't hold DB connections while rendering responses
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  application:
    name: ClothNCare

server:
  tomcat:
    threads:
      max: 25  # plenty for LAN use; keeps memory/CPU low on weak PCs
      min-spare: 4

# Secret must be at least 32 chars. Set the JWT_SECRET_KEY environment
# variable when running (never commit a real secret to the repository).
jwt:
  secret: ${JWT_SECRET_KEY:}

# WhatsApp messaging (Node whatsapp-web.js service + optional Cloud API). The
# Node service must be running for the webjs provider to work.
whatsapp:
  service-url: ${WHATSAPP_SERVICE_URL:http://127.0.0.1:3001}
  service-token: ${WHATSAPP_SERVICE_TOKEN:}
  default-country: ${WHATSAPP_DEFAULT_COUNTRY:IN}
  max-retries: ${WHATSAPP_MAX_RETRIES:3}
  delivery-poll-interval-ms: ${WHATSAPP_DELIVERY_POLL_INTERVAL_MS:30000}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

migration:
  swash-data-dir: ${MIGRATION_SWASH_DATA_DIR:./swash-data}
  enabled: ${MIGRATION_ENABLED:true}
