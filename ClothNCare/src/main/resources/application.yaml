spring:
  datasource:
    url: jdbc:sqlite:file:./data/clothncare.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: ClothNCare

# Secret must be at least 32 chars. Set the JWT_SECRET_KEY environment
# variable when running (never commit a real secret to the repository).
jwt:
  secret: ${JWT_SECRET_KEY:}

# WhatsApp messaging (Node whatsapp-web.js service + optional Cloud API). The
# Node service must be running for the webjs provider to work.
whatsapp:
  service-url: ${WHATSAPP_SERVICE_URL:http://127.0.0.1:3001}
  service-token: ${WHATSAPP_SERVICE_TOKEN:}
  default-country: ${WHATSAPP_DEFAULT_COUNTRY:IN}
  max-retries: ${WHATSAPP_MAX_RETRIES:3}
  delivery-poll-interval-ms: ${WHATSAPP_DELIVERY_POLL_INTERVAL_MS:30000}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:20000}

migration:
  swash-data-dir: ${MIGRATION_SWASH_DATA_DIR:./swash-data}
  enabled: ${MIGRATION_ENABLED:true}
